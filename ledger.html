<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Transaction Ledger</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --green: #16834b;
      --red: #dc2626;
      --shadow: 0 8px 24px rgba(15, 23, 42, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .danger {
      background: #fee2e2;
      color: var(--red);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 700;
    }

    .income { color: var(--green); }
    .expense { color: var(--red); }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      padding: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: white;
      min-width: 150px;
    }

    .search {
      flex: 1;
      min-width: 220px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .credit { color: var(--green); }
    .debit { color: var(--red); }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      padding: 7px 10px;
      background: #f3f4f6;
      color: #374151;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 45px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .5);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.open { display: flex; }

    .modal-box {
      background: white;
      width: min(560px, 100%);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 { margin: 0; }

    .close {
      background: transparent;
      font-size: 22px;
      padding: 3px 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
    }

    .modal-footer {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div>
        <h1>Bank Transaction Ledger</h1>
        <p class="subtitle">Track deposits, withdrawals, and your running balance.</p>
      </div>
      <button class="primary" onclick="openModal()">+ Add Transaction</button>
    </header>

    <section class="cards">
      <div class="card">
        <div class="card-label">Current Balance</div>
        <div class="card-value" id="balance">$0.00</div>
      </div>

      <div class="card">
        <div class="card-label">Total Income</div>
        <div class="card-value income" id="income">$0.00</div>
      </div>

      <div class="card">
        <div class="card-label">Total Expenses</div>
        <div class="card-value expense" id="expenses">$0.00</div>
      </div>

      <div class="card">
        <div class="card-label">Transactions</div>
        <div class="card-value" id="count">0</div>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input
          class="search"
          id="search"
          type="search"
          placeholder="Search transactions..."
          oninput="render()"
        >

        <select id="typeFilter" onchange="render()">
          <option value="all">All Types</option>
          <option value="credit">Deposits / Income</option>
          <option value="debit">Withdrawals / Expenses</option>
        </select>

        <select id="categoryFilter" onchange="render()">
          <option value="all">All Categories</option>
        </select>

        <button onclick="exportCSV()">Export CSV</button>
        <button class="danger" onclick="clearLedger()">Clear Ledger</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Account</th>
              <th>Amount</th>
              <th>Balance</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ledger"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Add Transaction</h2>
        <button class="close" onclick="closeModal()">×</button>
      </div>

      <form id="transactionForm">
        <input type="hidden" id="editId">

        <div class="form-grid">
          <div class="field">
            <label>Date</label>
            <input type="date" id="date" required>
          </div>

          <div class="field">
            <label>Type</label>
            <select id="type" required>
              <option value="debit">Withdrawal / Expense</option>
              <option value="credit">Deposit / Income</option>
            </select>
          </div>

          <div class="field">
            <label>Description</label>
            <input id="description" placeholder="e.g. Grocery store" required>
          </div>

          <div class="field">
            <label>Category</label>
            <input id="category" list="categories" placeholder="e.g. Groceries" required>
            <datalist id="categories">
              <option value="Income">
              <option value="Groceries">
              <option value="Rent">
              <option value="Utilities">
              <option value="Transportation">
              <option value="Dining">
              <option value="Shopping">
              <option value="Entertainment">
              <option value="Bills">
              <option value="Transfer">
              <option value="Other">
            </datalist>
          </div>

          <div class="field">
            <label>Account</label>
            <input id="account" placeholder="e.g. Checking" value="Checking" required>
          </div>

          <div class="field">
            <label>Amount</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
          </div>

          <div class="field full">
            <label>Notes</label>
            <input id="notes" placeholder="Optional notes">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" onclick="closeModal()">Cancel</button>
          <button class="primary" type="submit">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "bankLedgerTransactions";

    let transactions = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function money(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(value);
    }

    function formatDate(date) {
      const [y, m, d] = date.split("-");
      return `${m}/${d}/${y}`;
    }

    function calculateBalances() {
      let balance = 0;

      // Ledger balance is calculated chronologically.
      return [...transactions]
        .sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created)
        .map(t => {
          balance += t.type === "credit"
            ? Number(t.amount)
            : -Number(t.amount);

          return { ...t, runningBalance: balance };
        });
    }

    function render() {
      const search = document.getElementById("search").value.toLowerCase();
      const type = document.getElementById("typeFilter").value;
      const category = document.getElementById("categoryFilter").value;

      const all = calculateBalances();

      const filtered = all.filter(t => {
        const matchesSearch =
          t.description.toLowerCase().includes(search) ||
          t.category.toLowerCase().includes(search) ||
          t.account.toLowerCase().includes(search) ||
          (t.notes || "").toLowerCase().includes(search);

        const matchesType = type === "all" || t.type === type;
        const matchesCategory =
          category === "all" || t.category === category;

        return matchesSearch && matchesType && matchesCategory;
      });

      const ledger = document.getElementById("ledger");

      if (!filtered.length) {
        ledger.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              No transactions found.
            </td>
          </tr>
        `;
      } else {
        // Display newest transactions first.
        filtered.reverse();

        ledger.innerHTML = filtered.map(t => `
          <tr>
            <td>${formatDate(t.date)}</td>
            <td>
              <strong>${escapeHTML(t.description)}</strong>
              ${t.notes ? `<br><small>${escapeHTML(t.notes)}</small>` : ""}
            </td>
            <td><span class="badge">${escapeHTML(t.category)}</span></td>
            <td>${escapeHTML(t.account)}</td>
            <td class="amount ${t.type}">
              ${t.type === "credit" ? "+" : "-"}${money(t.amount)}
            </td>
            <td class="amount">${money(t.runningBalance)}</td>
            <td>
              <div class="actions">
                <button class="icon-btn" onclick="editTransaction('${t.id}')">Edit</button>
                <button class="icon-btn" onclick="deleteTransaction('${t.id}')">Delete</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      const income = transactions
        .filter(t => t.type === "credit")
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const expenses = transactions
        .filter(t => t.type === "debit")
        .reduce((sum, t) => sum + Number(t.amount), 0);

      document.getElementById("income").textContent = money(income);
      document.getElementById("expenses").textContent = money(expenses);
      document.getElementById("balance").textContent = money(income - expenses);
      document.getElementById("count").textContent = transactions.length;

      updateCategories();
    }

    function updateCategories() {
      const select = document.getElementById("categoryFilter");
      const current = select.value;

      const categories = [...new Set(
        transactions.map(t => t.category)
      )].sort();

      select.innerHTML =
        `<option value="all">All Categories</option>` +
        categories.map(c =>
          `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
        ).join("");

      if (categories.includes(current)) {
        select.value = current;
      }
    }

    function openModal(id = null) {
      const modal = document.getElementById("modal");
      const form = document.getElementById("transactionForm");

      form.reset();
      document.getElementById("editId").value = "";
      document.getElementById("date").value =
        new Date().toISOString().slice(0, 10);
      document.getElementById("account").value = "Checking";
      document.getElementById("modalTitle").textContent = "Add Transaction";

      if (id) {
        const t = transactions.find(x => x.id === id);
        if (!t) return;

        document.getElementById("modalTitle").textContent = "Edit Transaction";
        document.getElementById("editId").value = t.id;
        document.getElementById("date").value = t.date;
        document.getElementById("type").value = t.type;
        document.getElementById("description").value = t.description;
        document.getElementById("category").value = t.category;
        document.getElementById("account").value = t.account;
        document.getElementById("amount").value = t.amount;
        document.getElementById("notes").value = t.notes || "";
      }

      modal.classList.add("open");
      document.getElementById("description").focus();
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
    }

    document.getElementById("transactionForm").addEventListener("submit", e => {
      e.preventDefault();

      const id = document.getElementById("editId").value;

      const transaction = {
        id: id || crypto.randomUUID(),
        date: document.getElementById("date").value,
        type: document.getElementById("type").value,
        description: document.getElementById("description").value.trim(),
        category: document.getElementById("category").value.trim(),
        account: document.getElementById("account").value.trim(),
        amount: Number(document.getElementById("amount").value),
        notes: document.getElementById("notes").value.trim(),
        created: id
          ? (transactions.find(t => t.id === id)?.created || Date.now())
          : Date.now()
      };

      if (id) {
        const index = transactions.findIndex(t => t.id === id);
        transactions[index] = transaction;
      } else {
        transactions.push(transaction);
      }

      save();
      render();
      closeModal();
    });

    function editTransaction(id) {
      openModal(id);
    }

    function deleteTransaction(id) {
      const t = transactions.find(x => x.id === id);

      if (t && confirm(`Delete "${t.description}"?`)) {
        transactions = transactions.filter(x => x.id !== id);
        save();
        render();
      }
    }

    function clearLedger() {
      if (!transactions.length) return;

      if (confirm("Delete every transaction in the ledger?")) {
        transactions = [];
        save();
        render();
      }
    }

    function exportCSV() {
      if (!transactions.length) {
        alert("There are no transactions to export.");
        return;
      }

      const rows = [
        ["Date", "Type", "Description", "Category", "Account", "Amount", "Notes"],
        ...transactions
          .sort((a, b) => a.date.localeCompare(b.date))
          .map(t => [
            t.date,
            t.type,
            t.description,
            t.category,
            t.account,
            t.amount,
            t.notes || ""
          ])
      ];

      const csv = rows.map(row =>
        row.map(value =>
          `"${String(value).replace(/"/g, '""')}"`
        ).join(",")
      ).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "bank-ledger.csv";
      link.click();

      URL.revokeObjectURL(url);
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Close modal when clicking outside the dialog.
    document.getElementById("modal").addEventListener("click", e => {
      if (e.target.id === "modal") closeModal();
    });

    render();
  </script>
</body>
</html>
